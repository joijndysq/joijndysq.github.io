<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Page Not Found" />
    <meta name="author" content="Lyric" />
    <title>404 - 页面不存在</title>

    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />

    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <script>
        (function(){try{var t=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',(t==='dark'||(!t&&d))?'dark':'light');}catch(e){}})();
    </script>

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-code {
            font-family: "Kanit", sans-serif;
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6a6ff2, #ff7eb3, #7ec8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-msg {
            font-size: 1.3rem;
            color: var(--h-text-color);
            margin-bottom: 2rem;
        }
        .error-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #6a6ff2, #ff7eb3);
            color: #fff;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(106, 111, 242, 0.3);
        }
        .error-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(106, 111, 242, 0.5);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <p class="error-msg">这个页面被次元裂缝吞噬了 ✨</p>
            <a class="error-link" href="index.html"><i class="bi bi-house-door"></i> 返回主页</a>
        </div>
    </div>
</body>

</html>
